name: Daily Auto Commit

on:
  schedule:
    - cron: '30 18 * * *'   # Runs daily at 18:30 UTC (specific time, no wildcards)
  workflow_dispatch:         # allows manual trigger

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Step using email 24f1002702@ds.study.iitm.ac.in
        run: echo "Workflow triggered"


      - name: Make daily change
        run: |
          echo "Last updated on $(date)" >> daily-log.txt


      - name: Commit and push
        run: |
          git config --global user.name "DevSync Bot"
          git config --global user.email "24f1002702@ds.study.iitm.ac.in"
          git add daily-log.txt
          git commit -m "Daily automated commit"
          git push
